extraction:
  spacy_model: "en_core_web_sm"
  use_spacy_ner: true  # ensemble statistical NER on top of the gazetteer/regex pass
  use_dependency_parse: true  # trigger events off verb lemmas + syntactic args, not raw substrings
  entity_types:
    - "PERSON"
    - "ORG"
    - "GPE"
    - "LOC"
    - "EVENT"
    - "DATE"
    - "NORP"
  relation_confidence_threshold: 0.5
  use_deepke: true
  deepke:
    enabled: true
    command_template: "python ../../scripts/deepke_runner.py --input {input} --output {output}"
    conda_env: "deepke_py38"
    working_dir: "tools/deepke"
    output_dir: "data/exports/deepke"
    timeout_seconds: 600
    
temporal:
  engine: "heideltime"  # regex | heideltime
  heideltime:
    enabled: true
    jar_path: "tools/heideltime/HeidelTimeStandalone.jar"
    config_dir: "tools/heideltime/config"
    language: "en"
    document_type: "news"
  default_granularity: "day"
  unknown_date_strategy: "infer_from_context"

graph:
  neo4j_batch_size: 500
  node_label_article: "Article"
  node_label_entity: "Entity"
  node_label_event: "Event"

gdelt:
  base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
  query: "China Romania"
  mode: "artlist"
  format: "json"
  max_records: 250          # GDELT max is 250 per request
  default_timespan: "1week" # used when no explicit date range is given
  default_credibility: 0.7  # GDELT articles are unscored; default before scorer runs
  request_timeout: 30
  rate_limit_delay: 6.0  # GDELT enforces "one request every 5 seconds" (confirmed via their
  # own rate-limit response text); 1.0 was below that, causing every request after the first
  # in any multi-query run (e.g. run_big_experiment.sh's quarterly loop) to get rate-limited

credibility:
  default_score: 0.5
  use_veracity_score: true  # composite weighted score (veracity_score.py) vs. the legacy if/elif cascade
  veracity_weights:
    credibility: 0.3
    corroboration: 0.4
    temporal_consistency: 0.3
  semantic_similarity:
    enabled: true  # embed claim sentences and match near-duplicates across articles
    merge_corroboration: true  # fold semantic matches into corroboration groups, not just report them
    model: "sentence-transformers/all-MiniLM-L6-v2"
    threshold: 0.75  # cosine similarity; see evaluate_corroboration.py for the precision/recall tradeoff at this cutoff
  lexical_baseline:
    threshold: 0.3  # Jaccard token-overlap cutoff -- see evaluate_corroboration.py --baseline lexical
  contradiction_nli:
    enabled: true  # pairwise NLI contradiction check within a corroboration group
    model: "cross-encoder/nli-deberta-v3-xsmall"
    threshold: 0.5  # contradiction probability; see evaluate_contradiction.py
    min_relevance_similarity: 0.15  # skip NLI for topically-unrelated pairs (see evaluate_contradiction.py --gate;
    # calibrated low deliberately -- true contradictions can still diverge a lot in
    # surface wording, e.g. 0.19 similarity for a genuine "took place" vs. "was
    # cancelled" contradiction, so this only needs to catch clearly unrelated pairs)
    temporal_gate: true  # reclassify an NLI-contradictory pair as claim evolution (not
    # a real contradiction) when the two events' dates are Allen before/after/meets/
    # met_by rather than temporally coincident -- see evaluate_temporal_contradiction.py
    lifecycle_verification: true  # when temporal_gate says "evolution", additionally check
    # the group's full date-ordered claims trace a legal path through the event type's
    # lifecycle FSM (src/temporal/lifecycle.py) -- an illegal transition (e.g. "ratified"
    # before "signed") is downgraded back to a genuine contradiction, not evolution
  known_reliable_domains:
    - "reuters.com"
    - "bbc.co.uk"
    - "bbc.com"
    - "apnews.com"
    - "ft.com"
    - "scmp.com"
    - "rfi.ro"
    - "g4media.ro"
    # Added from real ingested data (2026-08-19), independent professional
    # outlets only -- see state_affiliated_domains below for the ones that
    # aren't editorially independent of a government.
    - "romania-insider.com"  # independent English-language Romanian business/news outlet
    - "seenews.com"          # established Southeast Europe business news wire agency
    - "rri.ro"               # Radio Romania International, public broadcaster (same
    # category as bbc.com above: state-funded but editorially independent, not the
    # same thing as state-affiliated media -- see state_affiliated_domains)
    - "bursa.ro"             # Romanian financial/business newspaper, independent
    - "romaniajournal.ro"    # The Romania Journal, independent English-language Romanian
    # news outlet -- missed in the first pass (2026-08-19), added after review of a real
    # corroboration group that included it alongside seenews.com/romania-insider.com
    # informat.ro and bastillepost.com also showed up in real ingested data but are
    # deliberately left off this list -- no confident basis to vouch for their
    # editorial standards, so they fall through to credibility.default_score instead
    # of being asserted as "reliable" without real evidence.
  state_affiliated_domains:
    # Real, identifiable, professionally-run outlets -- not anonymous or low-quality
    # sources -- but not editorially independent of the Chinese government, so scored
    # separately from known_reliable_domains rather than lumped in at the same 1.0.
    - "chinadaily.com.cn"    # China Daily, PRC state media
    - "radio.cgtn.com"       # CGTN, China's state broadcaster's international arm
  state_affiliated_score: 0.65  # above credibility.default_score (0.5, "unknown source")
  # since these are real identifiable outlets, but below the 1.0 known_reliable_domains
  # tier, reflecting standard media-literacy treatment of state-affiliated sources
  # Maps a domain to a shared publisher identifier for corroboration's
  # source_diversity (see src/credibility/publisher_networks.py) -- confirmed on
  # real data (2026-08-24) that raw-domain counting overstated diversity=8 for a
  # single Xinhua/People's Daily wire story mirrored across language editions.
  # Deliberately conservative: only networks with clear same-institution naming
  # evidence directly observed in real ingested domains are listed here.
  # china.org.cn, qianlong.com, gmw.cn, jstv.com etc. are NOT merged into this --
  # no direct evidence they're mirrors rather than genuinely separate outlets that
  # happen to also carry state-media wire copy (most outlets, state or not, run
  # wire-service stories; that alone isn't evidence of common ownership).
  publisher_networks:
    xinhua:
      - "xinhuanet.com"
      - "news.cn"
    peoples_daily:
      - "people.com.cn"
      - "peopledaily.com.cn"
      - "people.cn"
    cgtn:
      - "cgtn.com"
