# ─────────────────────────────────────────────────────────────────────────────
# temporal_kg — central configuration
# All values can be overridden with environment variables.
# Convention: TEMPORAL_KG_<SECTION>_<KEY>  (upper-snake-case)
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: "temporal_kg"
  version: "0.1.0"
  focus_countries: ["China", "Romania"]
  default_language: "en"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_exports: "data/exports"
  db: "db/temporal_kg.sqlite"
  logs: "logs"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  log_to_file: true
  log_file: "logs/temporal_kg.log"
  max_bytes: 10485760
  backup_count: 5

database:
  sqlite_path: "db/temporal_kg.sqlite"
  neo4j_uri: "bolt://localhost:7687"
  neo4j_user: "neo4j"
  neo4j_password: ""

ingestion:
  translate_to_english: true
  translate_unknown_to_english: true
  translation_target_language: "en"
  require_translation_success: true
  translation_rate_limit_delay: 2.0  # seconds between deep-translator calls. Added
  # 2026-08-25: translating short titles only (pre-full-text-scraping) never sent
  # enough requests to trip Google Translate's free-endpoint rate limit, so this
  # delay didn't exist. Once article_scraper.py started feeding real (much longer,
  # multi-chunk) body text through the same translator with zero delay between
  # calls, a historical-backfill run tripped rate limiting almost immediately:
  # 72/78 translation attempts failed, and some "successes" were actually Google's
  # HTML error page silently returned as translated text (see
  # _looks_like_error_page in translator.py) rather than raising an exception.
  user_agent: "temporal-kg-bot/0.1 (+research)"
  request_timeout: 10
  retry_attempts: 3
  retry_backoff: 2.0
  rate_limit_delay: 1.5
  scrape_full_text: true  # download each article's URL and extract body text via
  # trafilatura (src/ingestion/article_scraper.py), instead of relying on GDELT's
  # title/snippet alone. Confirmed 2026-08-24: GDELT's DOC 2.0 API essentially
  # never returns a snippet, so without this every article's "content" was just
  # its headline (303/303 articles in the corpus had content_raw == ""), and
  # event/claim extraction ran on headline text only. Best-effort per article --
  # falls back to title/snippet text on any fetch/extraction failure rather than
  # dropping the article. Set false to restore the old title-only behavior (e.g.
  # for a fast/offline test run).
  save_raw_html: true              # persist raw HTML to data/raw/
  save_json: true                  # persist cleaned article JSON to data/processed/
  resolve_google_news_urls: true   # decode Google News RSS wrapper links to the real
  # publisher URL (see src/ingestion/google_news_resolver.py) -- without this, every
  # Google-News-sourced article's source_domain reads as "news.google.com", which
  # silently destroys corroboration source-diversity and credibility-domain scoring.
  # Uses an unofficial decoder (googlenewsdecoder package); set false to skip it if
  # that package breaks or you'd rather not pay the extra network round-trip per article.
  # RSS/Atom feeds fetched by src/ingestion/rss_fetcher.py -- see
  # docs/REQUIREMENTS_MAPPING.md Section A, which claimed these were already
  # wired up (they weren't, as of 2026-08-19; this block and rss_fetcher.py
  # are the actual first implementation). CGTN is left out deliberately:
  # REQUIREMENTS_MAPPING.md names it ("CGTN feeds, filtered for Romania
  # content") without a concrete feed URL, and guessing one risks a dead or
  # wrong link -- add it once a real CGTN RSS endpoint is confirmed.
  rss_feeds:
    - name: "Google News (China+Romania)"
      url: "https://news.google.com/rss/search?q=%22Romania%22%20%22China%22&hl=en-US&gl=US&ceid=US:en"
      country: "bilateral"
      credibility: 0.6  # aggregator of many sources, not a single newsroom
    - name: "Radio Romania International"
      url: "https://www.rri.ro/en/feed"
      country: "Romania"
      credibility: 0.8  # public broadcaster
    # "Bursa Romania (Business News)" (https://www.bursa.ro/titluribursa.xml) is
    # left out: confirmed HTTP 404 as of 2026-08-19, a dead link despite being
    # named in docs/REQUIREMENTS_MAPPING.md -- re-add once a live replacement
    # URL is found on bursa.ro.
    - name: "Bursa Romania (Capital Markets)"
      url: "https://www.bursa.ro/piata-capital-bursa.xml"
      country: "Romania"
      credibility: 0.6
    - name: "Radio Free Europe/Radio Liberty"
      url: "https://www.rferl.org/api/ziiivl-vomx-tpemgmt"
      country: "general"
      credibility: 0.8  # established international broadcaster; confirmed live/valid
      # RSS as of 2026-08-19 but returned 0 <item> entries at check time -- kept
      # configured since the feed itself is real, just possibly transiently empty

